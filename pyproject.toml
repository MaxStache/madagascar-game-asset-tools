[project]
name = "madkit"
version = "0.1.7"
description = "CLI and tools for modding Madagascar (2005)"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Max Stache" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "cyclopts>=4.22.5",
    "fonttools>=4.63.0",
    "madformats>=0.1.3",
    "madlysimple>=0.1.3",
    "pillow>=12.3.0",
    "pymem>=1.14.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.0",
    "tfbpseudo[editor]>=0.1.2",
    "tfbscript>=0.1.3",
    "tqdm>=4.68.4",
    "watchdog>=6.0.0",
]

[project.urls]
Repository = "https://github.com/MaxStache/madagascar-game-asset-tools"
Issues = "https://github.com/MaxStache/madagascar-game-asset-tools/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
madkit = "madkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.sdist]
only-include = ["src/madkit"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/tfbscript/tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "gamedata: needs the stock level files in Levels/ (gitignored, skipped when missing)",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
madlysimple = { workspace = true }
madformats = { workspace = true }
tfbpseudo = { workspace = true }
tfbscript = { workspace = true }
