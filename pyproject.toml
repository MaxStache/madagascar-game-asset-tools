[project]
name = "madagascar-game-asset-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "colorama>=0.4.6",
    "cyclopts==4.22.5",
    "fonttools>=4.63.0",
    "madagascar",
    "madlysimple",
    "numpy==2.5.1",
    "pillow==12.3.0",
    "pymem==1.14.0",
    "pymemoryeditor>=2.1.0",
    "pyside6>=6.11.2",
    "pyyaml>=6.0.3",
    "rich==14.3.0",
    "tqdm==4.68.4",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cli = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "formats"]

[tool.uv.workspace]
members = [
    "madlysimple",
    "madagascar",
]

[tool.uv.sources]
madlysimple = { workspace = true, editable = true }
madagascar = { workspace = true, editable = true }
