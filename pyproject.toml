[project]
name = "madagascar-game-asset-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "cyclopts==4.22.5",
    "numpy==2.5.1",
    "pillow==12.3.0",
    "pymem==1.14.0",
    "rich==14.3.0",
    "tqdm==4.68.4",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cli = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "formats"]